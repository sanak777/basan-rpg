<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>바카라산악회 RPG v2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101512;color:#f5f0df;font-family:system-ui,sans-serif;overflow:hidden}.hidden{display:none!important}button,input{font:inherit}.btn{border:1px solid #d3b66c;background:linear-gradient(#f3d989,#b78735);color:#2b2110;font-weight:900;border-radius:10px;padding:11px 15px;box-shadow:0 3px 0 #62491d;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #62491d}.muted{color:#c2c8b6;font-size:12px}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#496747,#17271f 60%,#0a100e);padding:16px}.panel{width:min(680px,100%);border:2px solid #b79b59;background:linear-gradient(135deg,#17231d,#26372b);border-radius:18px;box-shadow:0 18px 60px #0009;padding:22px}.brand{text-align:center;font-weight:1000;font-size:clamp(25px,6vw,42px);color:#f4d783;text-shadow:0 3px #4a3215;letter-spacing:1px}.subtitle{text-align:center;color:#d1d6c4;margin:5px 0 20px}.classgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.classcard{background:#0c1712;border:1px solid #596c4c;border-radius:12px;padding:13px;text-align:left;color:#fff;min-height:112px}.classcard.selected{border:2px solid #f5d36f;background:#30442d;box-shadow:0 0 0 2px #f5d36f22}.classicon{font-size:30px}.classcard b{display:block;color:#f6d783}.classcard small{color:#c6d2c0}.nameinput{display:block;width:100%;margin:13px 0;background:#0c1410;color:#fff;border:1px solid #6d7c60;border-radius:9px;padding:12px}.app{height:100dvh;display:flex;flex-direction:column;max-width:1300px;margin:auto;background:#17231b}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:linear-gradient(90deg,#18261e,#30452f);border-bottom:2px solid #b79b59}.logo{font-weight:1000;color:#f6d783}.statrow{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#101a14;border:1px solid #56664b;border-radius:7px;padding:5px 7px;font-size:11px}.stage{position:relative;flex:1;min-height:0;background:#294c31}canvas{width:100%;height:100%;display:block;touch-action:none}.hudbottom{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:8px;background:#111a15;border-top:1px solid #536047}.lefttools,.righttools{display:flex;gap:7px;align-items:center}.smallbtn{background:#26392b;color:#f8e6b0;border:1px solid #78845a;border-radius:9px;padding:9px 11px;font-weight:800}.attack{border-color:#d5a64c;background:linear-gradient(#f0c76d,#9b5727);color:#fff}.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#101810ed;border:1px solid #e2c66e;border-radius:9px;padding:8px 12px;font-size:12px;max-width:90%;text-align:center;z-index:4}.joy{position:absolute;left:14px;bottom:14px;width:112px;height:112px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff66;touch-action:none}.stick{position:absolute;left:33px;top:33px;width:42px;height:42px;border-radius:50%;background:#e5d6a5cc;border:2px solid #fff}.skill{position:absolute;right:17px;bottom:104px;border-radius:50%;width:65px;height:65px;padding:4px}.attackfloat{position:absolute;right:15px;bottom:18px;border-radius:50%;width:78px;height:78px;padding:4px}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}.modalbox{width:min(600px,100%);max-height:82dvh;overflow:auto;background:#1a2b20;border:2px solid #b79b59;border-radius:15px;padding:15px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#f5d57e;font-weight:900;font-size:20px}.itemrow{display:flex;align-items:center;gap:8px;padding:9px;border-bottom:1px solid #40513d}.itemrow .desc{flex:1;min-width:0}.itemrow small{display:block;color:#bdc9b7}.itemrow button{padding:7px 9px}.equipgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.equipcell{background:#0d1711;border:1px solid #45583f;border-radius:9px;padding:9px;font-size:12px}.equipcell b{display:block;color:#f1d078}.help{font-size:12px;color:#c5d0bd;line-height:1.5}
@media(max-width:520px){.top{align-items:flex-start;flex-direction:column}.statrow{justify-content:flex-start}.logo{font-size:14px}.classcard{padding:10px;min-height:104px}.panel{padding:16px}.hudbottom{padding:6px}.smallbtn{padding:8px 9px;font-size:12px}.joy{width:100px;height:100px}.stick{left:28px;top:28px}.skill{bottom:95px}.attackfloat{width:70px;height:70px}}
</style></head><body>
<div id="login" class="screen"><div class="panel"><div class="brand">⚔ 바카라산악회 ⚔</div><div class="subtitle">FANTASY WORLD · ONLINE RPG</div><p style="text-align:center;margin:0 0 12px">직업을 선택하고 모험을 시작하세요</p><div class="classgrid" id="classgrid">
<button class="classcard selected" data-class="warrior"><div class="classicon">🛡️</div><b>고회장 · 전사</b><small>높은 체력과 방어력 · 강력한 강타</small></button>
<button class="classcard" data-class="archer"><div class="classicon">🏹</div><b>신선생 · 궁수</b><small>긴 사거리 · 빠른 연속 사격</small></button>
<button class="classcard" data-class="mage"><div class="classicon">🔮</div><b>낙엽이 · 마법사</b><small>강력한 마법 공격 · 낮은 방어력</small></button>
<button class="classcard" data-class="healer"><div class="classicon">💚</div><b>새싹이 · 보조힐러</b><small>균형 잡힌 생존력 · 치유의 빛</small></button></div><input id="charname" class="nameinput" maxlength="12" placeholder="캐릭터 이름 (최대 12자)" value="모험가"><button id="start" class="btn" style="width:100%;font-size:17px">월드 입장</button><p class="muted" style="text-align:center;margin-bottom:0">몬스터는 플레이어를 감지하면 반격합니다. 장비와 주문서를 모아 성장하세요!</p></div></div>
<div id="game" class="app hidden"><header class="top"><div><div class="logo">⚔ 바카라산악회 RPG</div><div class="muted" id="classlabel">월드 연결 중</div></div><div class="statrow"><div class="pill">Lv.<b id="lv">1</b></div><div class="pill">❤️ <b id="hp">--</b></div><div class="pill">⚔ <b id="atk">--</b></div><div class="pill">🛡 <b id="def">--</b></div><div class="pill">EXP <b id="xp">0</b></div><div class="pill">🪙 <b id="gold">0</b></div><div class="pill">👥 <b id="online">1</b></div></div></header>
<main class="stage"><canvas id="world"></canvas><div class="toast" id="toast">서버에 연결하는 중...</div><div class="joy" id="joy"><div class="stick" id="stick"></div></div><button class="btn skill" id="skill">✨<br><small id="skillname">스킬</small></button><button class="btn attack attackfloat" id="attack">⚔<br>공격</button></main>
<footer class="hudbottom"><div class="lefttools"><button class="smallbtn" id="bag">🎒 가방</button><button class="smallbtn" id="equip">🛡 장비</button></div><div class="righttools"><button class="smallbtn" id="changeName">닉네임</button><span class="muted" id="connection">연결 중</span></div></footer></div>
<div id="inventoryModal" class="modal hidden"><div class="modalbox"><div class="modalhead"><span>🎒 가방 & 장비</span><button class="smallbtn" data-close="inventoryModal">닫기 ✕</button></div><div class="equipgrid" id="equipgrid"></div><div id="items"></div><p class="help">무기·방어구·장신구는 장착할 수 있습니다. 강화 주문서는 해당 장비를 장착한 뒤 사용하세요. 강화 성공률 78%이며 실패해도 장비는 유지됩니다.</p></div></div>
<script>
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');let selected='warrior',ws,myId=null,world={w:2600,h:1800},players=[],mobs=[],me=null,keys={},joy={x:0,y:0},toastTimer;
document.querySelectorAll('.classcard').forEach(b=>b.onclick=()=>{document.querySelectorAll('.classcard').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.dataset.class});
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2400)}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host);ws.onopen=()=>{$('connection').textContent='● 온라인';$('connection').style.color='#8de39c';};ws.onclose=()=>{$('connection').textContent='재접속 중';setTimeout(connect,1800)};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==='hello')return;if(d.type==='joined'){myId=d.id;me=d.player;world=d.player?world:world;$('login').classList.add('hidden');$('game').classList.remove('hidden');resize();toast('월드 입장 완료! 주변 몬스터를 사냥하세요.');renderHud()}if(d.type==='state'){world=d.world;players=d.players;mobs=d.mobs;me=players.find(p=>p.id===myId)||me;renderHud()}if(d.type==='notice')toast(d.text)}}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
$('start').onclick=()=>{if(!ws||ws.readyState!==1){toast('서버 연결을 기다려주세요.');return}send({type:'join',classId:selected,name:$('charname').value||'모험가'});$('start').disabled=true;setTimeout(()=>$('start').disabled=false,1500)};
function renderHud(){if(!me)return;$('lv').textContent=me.level;$('hp').textContent=me.hp+'/'+me.maxHp;$('atk').textContent=me.atk;$('def').textContent=me.def;$('xp').textContent=me.xp+'/'+me.level*100;$('gold').textContent=me.gold;$('online').textContent=players.length;$('classlabel').textContent=me.className+' · '+me.name;$('skillname').textContent=({warrior:'강타',archer:'연사',mage:'화염구',healer:'치유'})[me.classId]||'스킬'}
function resize(){let r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}new ResizeObserver(resize).observe(canvas);
function round(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawTree(x,y){ctx.fillStyle='#173b25';ctx.beginPath();ctx.ellipse(x,y+11,19,9,0,0,7);ctx.fill();ctx.fillStyle='#245332';ctx.beginPath();ctx.arc(x,y,19,0,7);ctx.fill();ctx.fillStyle='#3d7842';ctx.beginPath();ctx.arc(x-5,y-5,13,0,7);ctx.fill();ctx.fillStyle='#63944b';ctx.beginPath();ctx.arc(x+3,y-7,7,0,7);ctx.fill()}
function draw(){let w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);if(!me){requestAnimationFrame(draw);return}let cx=Math.max(0,Math.min(world.w-w,me.x-w/2)),cy=Math.max(0,Math.min(world.h-h,me.y-h/2));ctx.save();ctx.translate(-cx,-cy);
// detailed grass tiles
for(let x=Math.floor(cx/64)*64;x<cx+w+64;x+=64)for(let y=Math.floor(cy/64)*64;y<cy+h+64;y+=64){ctx.fillStyle=((x/64+y/64)%3===0)?'#315e3a':'#2d5736';ctx.fillRect(x,y,64,64);ctx.strokeStyle='#396744';ctx.strokeRect(x,y,64,64);for(let k=0;k<5;k++){ctx.fillStyle='#47754a';ctx.fillRect(x+(k*17+13)%58,y+(k*23+7)%58,2,5)}}
// stone roads
ctx.strokeStyle='#5d6149';ctx.lineWidth=118;ctx.beginPath();ctx.moveTo(-20,world.h*.52);ctx.bezierCurveTo(480,world.h*.48,690,world.h*.68,1200,world.h*.53);ctx.bezierCurveTo(1700,world.h*.38,2070,world.h*.57,world.w+40,world.h*.49);ctx.stroke();ctx.strokeStyle='#9a9270';ctx.lineWidth=102;ctx.stroke();ctx.strokeStyle='#b1a784';ctx.lineWidth=2;ctx.setLineDash([12,12]);ctx.stroke();ctx.setLineDash([]);
// lake
ctx.fillStyle='#254d5a';ctx.beginPath();ctx.ellipse(330,320,180,105,-.2,0,7);ctx.fill();ctx.strokeStyle='#6ca5a2';ctx.lineWidth=4;ctx.stroke();for(let i=0;i<8;i++){ctx.strokeStyle='#4d8281';ctx.beginPath();ctx.moveTo(220+i*27,300+i%3*15);ctx.lineTo(260+i*27,298+i%3*15);ctx.stroke()}
// trees in fixed groves
for(let x=70;x<world.w;x+=105)for(let y=75;y<world.h;y+=105){let roadDist=Math.abs(y-world.h*.52);if(roadDist<100||((x-330)**2/35000+(y-320)**2/16000)<1||Math.abs(x-world.w/2)<200&&Math.abs(y-world.h/2)<230)continue;if((Math.floor(x/105)+Math.floor(y/105))%4!==0)drawTree(x+Math.sin(y)*13,y+Math.cos(x)*10)}
// village
let vx=world.w/2,vy=world.h/2;round(vx-200,vy-220,400,360,24,'#25412b');ctx.strokeStyle='#b39a5a';ctx.lineWidth=4;ctx.strokeRect(vx-200,vy-220,400,360);
for(let [x,y,c] of [[vx-125,vy-130,'#80573b'],[vx+120,vy-125,'#68513c'],[vx-10,vy+70,'#79513a']]){round(x-34,y-22,68,55,5,'#47372a');ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x-45,y-18);ctx.lineTo(x,y-58);ctx.lineTo(x+45,y-18);ctx.closePath();ctx.fill();ctx.strokeStyle='#d6b77a';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#251e17';ctx.fillRect(x-9,y+6,18,27)}
ctx.fillStyle='#f4d783';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText('산악회 마을',vx,vy-183);
// monsters
for(let m of mobs){if(!m.alive)continue;let x=m.x,y=m.y;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(x,y+14,18,7,0,0,7);ctx.fill();if(m.type==='goblin'){round(x-13,y-17,26,30,7,'#729b43');ctx.fillStyle='#9ac75e';ctx.beginPath();ctx.arc(x,y-14,13,0,7);ctx.fill();ctx.fillStyle='#f5efbd';ctx.fillRect(x-7,y-16,4,5);ctx.fillRect(x+3,y-16,4,5);ctx.fillStyle='#463927';ctx.fillRect(x-5,y-4,10,3)}else{ctx.fillStyle='#56bda7';ctx.beginPath();ctx.arc(x,y,17,0,7);ctx.fill();ctx.fillStyle='#8ce5d2';ctx.beginPath();ctx.arc(x-4,y-6,8,0,7);ctx.fill();ctx.fillStyle='#143b36';ctx.fillRect(x-7,y-2,4,4);ctx.fillRect(x+4,y-2,4,4)}round(x-20,y-29,40,5,2,'#19221a');round(x-20,y-29,40*m.hp/m.maxHp,5,2,'#e6534e');ctx.fillStyle='#fff';ctx.font='11px sans-serif';ctx.fillText(m.name,x,y-35)}
// players with class appearance
for(let p of players){let x=p.x,y=p.y;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(x,y+15,16,7,0,0,7);ctx.fill();let body=p.classId==='warrior'?'#d6b66a':p.classId==='archer'?'#65b77c':p.classId==='mage'?'#9384dc':'#e58bb9';round(x-11,y-14,22,28,6,body);ctx.fillStyle='#d6c5a1';ctx.beginPath();ctx.arc(x,y-17,10,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.fillText(p.name,x,y-32);if(p.id===myId){ctx.strokeStyle='#ffe17d';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.stroke();}}
// decorative light
let g=ctx.createRadialGradient(vx,vy,20,vx,vy,300);g.addColorStop(0,'#f2d28b15');g.addColorStop(1,'#0000');ctx.fillStyle=g;ctx.fillRect(vx-300,vy-300,600,600);
ctx.restore();requestAnimationFrame(draw)}draw();
setInterval(()=>{if(!me)return;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+joy.x,dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+joy.y;if(dx||dy)send({type:'move',dx,dy})},55);
document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){e.preventDefault();send({type:'attack'})}if(e.key.toLowerCase()==='q')send({type:'skill'})});document.addEventListener('keyup',e=>keys[e.key]=false);
$('attack').onpointerdown=e=>{e.preventDefault();send({type:'attack'})};$('skill').onpointerdown=e=>{e.preventDefault();send({type:'skill'})};
let active=false;function joyMove(e){let r=$('joy').getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),max=r.width*.34;if(d>max){dx=dx/d*max;dy=dy/d*max}$('stick').style.transform=`translate(${dx}px,${dy}px)`;joy.x=dx/max;joy.y=dy/max}
$('joy').onpointerdown=e=>{active=true;$('joy').setPointerCapture(e.pointerId);joyMove(e)};$('joy').onpointermove=e=>{if(active)joyMove(e)};function joyEnd(){active=false;joy.x=joy.y=0;$('stick').style.transform='translate(0,0)'}$('joy').onpointerup=joyEnd;$('joy').onpointercancel=joyEnd;
function openInventory(){if(!me)return;$('inventoryModal').classList.remove('hidden');let slots=[['weapon','무기'],['armor','방어구'],['accessory','장신구']];$('equipgrid').innerHTML=slots.map(([s,n])=>{let i=me.equip[s];return `<div class="equipcell"><b>${n}</b>${i?`${i.name} +${i.enhance||0}<br>공격 ${i.atk||0} · 방어 ${i.def||0}`:'비어 있음'}</div>`}).join('');$('items').innerHTML=me.inventory.length?me.inventory.map(i=>`<div class="itemrow"><span style="font-size:24px">${i.icon||'📦'}</span><div class="desc"><b>${i.name}${i.enhance?` +${i.enhance}`:''}</b><small>${i.qty>1?'수량: '+i.qty+' · ':''}${i.type==='weapon'?'무기':i.type==='armor'?'방어구':i.type==='accessory'?'장신구':i.type==='scroll'?'강화 주문서':i.type==='consumable'?'소모품':'재료'} ${i.atk?'· 공격 +'+i.atk:''}${i.def?'· 방어 +'+i.def:''}</small></div>${i.slot?`<button class="smallbtn" onclick="send({type:'equip',id:'${i.id}'});setTimeout(openInventory,250)">장착</button>`:(i.type==='scroll'||i.type==='consumable')?`<button class="smallbtn" onclick="send({type:'use',id:'${i.id}'});setTimeout(openInventory,250)">사용</button>`:''}</div>`).join(''):'<p class="muted">가방이 비어 있습니다. 몬스터를 사냥해 아이템을 획득하세요.</p>'}
$('bag').onclick=openInventory;$('equip').onclick=openInventory;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.add('hidden'));$('inventoryModal').onclick=e=>{if(e.target===$('inventoryModal'))$('inventoryModal').classList.add('hidden')};$('changeName').onclick=()=>{let n=prompt('새 캐릭터 이름',me?.name||'모험가');if(n)send({type:'name',name:n})};
connect();
</script></body></html>
