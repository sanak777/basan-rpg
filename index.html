<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>바카라산악회 RPG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column;max-width:1200px;margin:auto;background:#16242a}.top{padding:9px 12px;background:linear-gradient(90deg,#172b25,#263c30);display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:2px solid #c9a85b}.logo{font-weight:900;letter-spacing:.5px;color:#f6d783}.sub{font-size:11px;color:#b6c8bd}.stats{display:flex;gap:9px;font-size:12px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#0d1717;border:1px solid #53675a;border-radius:7px;padding:5px 7px}.bar{height:5px;background:#374151;border-radius:4px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:#ef4444;width:100%}.stage{position:relative;flex:1;min-height:0;background:#203c2c}canvas{display:block;width:100%;height:100%;touch-action:none}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:#111b20;border-top:1px solid #46554a}.hint{font-size:11px;color:#b6c7bd;line-height:1.45}.btn{border:1px solid #a88b45;border-radius:10px;background:linear-gradient(#e6c46b,#a87d2e);color:#21190a;font-weight:900;padding:12px 16px;font-size:14px;touch-action:manipulation}.btn:active{transform:scale(.96)}.joystick{display:none;position:absolute;left:18px;bottom:18px;width:116px;height:116px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55;touch-action:none}.stick{position:absolute;width:44px;height:44px;left:34px;top:34px;border-radius:50%;background:#e8d6a4aa;border:2px solid #fff9}.attack{position:absolute;right:20px;bottom:24px;width:82px;height:82px;border-radius:50%;font-size:15px}.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#0c1515e8;border:1px solid #d6b65c;padding:8px 13px;border-radius:9px;font-size:12px;white-space:nowrap;pointer-events:none}.namebox{display:flex;gap:5px}.namebox input{width:95px;min-width:0;border-radius:7px;border:1px solid #52645b;background:#0c1515;color:white;padding:7px}
@media(min-width:760px){.joystick{display:block}.attack{bottom:28px}.hint{font-size:12px}}@media(max-width:500px){.top{align-items:flex-start;flex-direction:column;gap:6px}.stats{justify-content:flex-start}.bottom{align-items:flex-start}.hint{max-width:60%}.joystick{display:block;width:104px;height:104px}.stick{left:29px;top:29px}.attack{width:74px;height:74px;right:15px;bottom:18px}}
</style></head><body><div class="app">
<header class="top"><div><div class="logo">⚔ 바카라산악회 RPG</div><div class="sub">BASAN WORLD · 온라인 테스트 월드</div></div><div class="stats"><div class="pill">Lv.<b id="lv">1</b><div class="bar"><i id="xpbar" style="background:#eab308;width:0%"></i></div></div><div class="pill">❤️ <b id="hp">100/100</b><div class="bar"><i id="hpbar"></i></div></div><div class="pill">EXP <b id="xp">0/100</b></div><div class="pill">🪙 <b id="gold">0</b></div><div class="pill">👥 <b id="online">1</b></div></div></header>
<main class="stage"><canvas id="game"></canvas><div class="toast" id="toast">월드에 접속하는 중...</div><div class="joystick" id="joy"><div class="stick" id="stick"></div></div><button class="btn attack" id="attack">⚔ 공격</button></main>
<footer class="bottom"><div class="hint">PC: WASD / 방향키 이동 · 스페이스 공격<br>모바일: 왼쪽 조이스틱 이동 · 공격 버튼<br><span id="connection">서버 연결 중...</span></div><div class="namebox"><input id="name" maxlength="12" value="모험가" aria-label="캐릭터 이름"><button class="btn" id="saveName">이름 저장</button></div></footer>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let myId=null,world={w:2400,h:1600},players=[],monsters=[],me={x:1200,y:800,level:1,hp:100,maxHp:100,xp:0,gold:0},keys={},joy={x:0,y:0},toastTimer;
const toast=t=>{let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.display='none',2200)};
const wsProto=location.protocol==='https:'?'wss:':'ws:';
let ws;function connect(){ws=new WebSocket(wsProto+'//'+location.host);ws.onopen=()=>{document.getElementById('connection').textContent='● 서버 연결됨';document.getElementById('connection').style.color='#7ee787';ws.send(JSON.stringify({type:'name',name:document.getElementById('name').value}));};ws.onclose=()=>{document.getElementById('connection').textContent='연결 끊김 · 재접속 중';setTimeout(connect,1800)};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==='welcome'){myId=d.id;world=d.world;me=d.player;toast('바카라산악회 월드에 입장했습니다!')}if(d.type==='state'){world=d.world;players=d.players;monsters=d.monsters;let p=players.find(p=>p.id===myId);if(p)me=p;updateHud()}if(d.type==='notice')toast(d.text)}}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
function updateHud(){document.getElementById('lv').textContent=me.level;document.getElementById('hp').textContent=me.hp+'/'+me.maxHp;document.getElementById('hpbar').style.width=(me.hp/me.maxHp*100)+'%';document.getElementById('xp').textContent=me.xp+'/'+(me.level*100);document.getElementById('xpbar').style.width=(me.xp/(me.level*100)*100)+'%';document.getElementById('gold').textContent=me.gold;document.getElementById('online').textContent=players.length}
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(r.width*dpr);canvas.height=Math.floor(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(canvas);resize();
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);const camX=Math.max(0,Math.min(world.w-w,me.x-w/2)),camY=Math.max(0,Math.min(world.h-h,me.y-h/2));ctx.save();ctx.translate(-camX,-camY);
ctx.fillStyle='#315c3c';ctx.fillRect(0,0,world.w,world.h);
// grass speckles
for(let x=20;x<world.w;x+=56)for(let y=20;y<world.h;y+=56){ctx.fillStyle=((x*3+y*7)%5===0)?'#3a6843':'#35613e';ctx.fillRect(x+(y%13),y,2,2)}
// winding path
ctx.strokeStyle='#7d7758';ctx.lineWidth=105;ctx.beginPath();ctx.moveTo(0,world.h*.52);ctx.bezierCurveTo(500,world.h*.44,650,world.h*.68,1150,world.h*.52);ctx.bezierCurveTo(1600,world.h*.35,1850,world.h*.62,world.w,world.h*.48);ctx.stroke();ctx.strokeStyle='#a69a70';ctx.lineWidth=88;ctx.stroke();
// trees around world
for(let x=65;x<world.w;x+=125)for(let y=65;y<world.h;y+=120){if(Math.abs(y-world.h*.52)<100)continue;ctx.fillStyle='#1b422b';ctx.beginPath();ctx.arc(x+Math.sin(y+x)*16,y+Math.cos(x)*10,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4d8a4d';ctx.beginPath();ctx.arc(x-4,y-5,13,0,Math.PI*2);ctx.fill()}
// village tents/houses
for(const [x,y] of [[world.w/2-170,world.h/2-180],[world.w/2+150,world.h/2-165],[world.w/2-25,world.h/2+170]]){rounded(x-30,y-22,60,48,5,'#5b4630');ctx.fillStyle='#b7a078';ctx.beginPath();ctx.moveTo(x-38,y-20);ctx.lineTo(x,y-55);ctx.lineTo(x+38,y-20);ctx.closePath();ctx.fill();ctx.fillStyle='#30271f';ctx.fillRect(x-8,y+2,16,24)}
// monsters
for(const m of monsters){if(!m.alive)continue;const x=m.x,y=m.y;ctx.fillStyle='#15251b66';ctx.beginPath();ctx.ellipse(x,y+13,17,7,0,0,Math.PI*2);ctx.fill();if(m.type==='goblin'){rounded(x-11,y-14,22,26,6,'#8fba55');ctx.fillStyle='#e6e7a5';ctx.fillRect(x-7,y-7,4,4);ctx.fillRect(x+3,y-7,4,4)}else{ctx.fillStyle='#7ed7c5';ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eafff6';ctx.fillRect(x-6,y-3,4,4);ctx.fillRect(x+3,y-3,4,4)}rounded(x-18,y-25,36,4,2,'#303030');rounded(x-18,y-25,36*(m.hp/m.maxHp),4,2,'#ef4444');ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(m.type==='goblin'?'고블린':'슬라임',x,y-31)}
// players
for(const p of players){ctx.fillStyle='#14231b77';ctx.beginPath();ctx.ellipse(p.x,p.y+15,15,6,0,0,Math.PI*2);ctx.fill();rounded(p.x-10,p.y-15,20,27,5,p.id===myId?'#e7d29a':'#a9c9ef');rounded(p.x-7,p.y-19,14,12,4,p.id===myId?'#d5e4ed':'#c7d7e8');ctx.fillStyle='#26313a';ctx.fillRect(p.x-6,p.y-12,3,3);ctx.fillRect(p.x+3,p.y-12,3,3);ctx.fillStyle=p.id===myId?'#ffe49b':'#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(p.name,p.x,p.y-28);if(p.id===myId){ctx.strokeStyle='#ffe49b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,22,0,Math.PI*2);ctx.stroke()}}
ctx.restore();requestAnimationFrame(draw)}draw();
setInterval(()=>{let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+joy.x,dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+joy.y;const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}if(dx||dy)send({type:'move',dx,dy})},55);
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' ')attack()});document.addEventListener('keyup',e=>keys[e.key]=false);
function attack(){send({type:'attack'})}document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});
document.getElementById('saveName').onclick=()=>{send({type:'name',name:document.getElementById('name').value});toast('캐릭터 이름을 저장했습니다.')};
const joyEl=document.getElementById('joy'),stick=document.getElementById('stick');let active=false;
function joyMove(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,dist=Math.hypot(dx,dy),max=r.width*.34;if(dist>max){dx=dx/dist*max;dy=dy/dist*max}joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}
joyEl.addEventListener('pointerdown',e=>{active=true;joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(active)joyMove(e)});function joyEnd(){active=false;joy.x=joy.y=0;stick.style.transform='translate(0,0)'}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
connect();
</script></body></html>
